<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATLYR</title>
    <meta name="description" content="Your personal fashion companion">

    <link rel="manifest" href="/manifest.json" />
    
    <!--
      All webfonts load here, in one request. src/index.css used to add four
      more @import rules on top of this link, which serialised into a waterfall
      after CSS parse.

        Bodoni Moda            display serif  (--font-serif)
        Hanken Grotesk         UI sans        (--font-sans)
        Noto Serif Devanagari  brand only     (--font-deva) — कलागृह wordmark
        Inter / Source Serif 4 / Roboto Mono  ops surfaces only, see
                               :root[data-surface="ops"] in src/index.css

        Playfair Display and Pacifico are gone as of the rebrand sweep. The
        landing page set Pacifico inline on its emphasised phrases; those now
        take Bodoni italic like the rest of the brand. Playfair was still being
        requested despite having no reference left in src at all.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    
    
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://atlyr.in/" />
    <meta property="og:site_name" content="ATLYR" />
    <meta property="og:title" content="ATLYR" />
    <meta property="og:description" content="Your personal fashion companion" />
    <meta property="og:image" content="https://atlyr.in/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ATLYR" />
    <meta name="twitter:description" content="Your personal fashion companion" />
    <meta name="twitter:image" content="https://atlyr.in/social-card.png" />
    <meta name="twitter:image:alt" content="ATLYR - Your personal fashion companion" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
