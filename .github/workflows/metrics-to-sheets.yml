name: Metrics to Google Sheets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # The script has no npm dependencies, so no install step.
      - run: bun run scripts/launch-metrics.ts --sheets
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          METRICS_SHEET_ID: ${{ secrets.METRICS_SHEET_ID }}
